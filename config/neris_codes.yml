# ==============================================================================
# FIELD MAPPING REFERENCE
# ==============================================================================

field_mapping:
  # NERIS to NFIRS column name mapping
  # Used by data loader for backward compatibility
  column_names:
    heat_sourc: heat_source
    first_ign: item_first_ig
    area_orig: area_origin
    cause_ign: cause_ignition
    inc_type: incident_type
    inc_no: incident_number

  # NERIS hierarchical types to NFIRS numeric codes
  incident_type_mapping:
    "FIRE: STRUCTURE_FIRE": 111
    "FIRE: TRANSPORTATION_FIRE: VEHICLE_FIRE_PASSENGER": 131
    "FIRE: TRANSPORTATION_FIRE: POWERED_MOBILITY_DEVICE_FIRE": 138
    "FIRE: OUTSIDE_FIRE: VEGETATION_GRASS_FIRE": 143
    "FIRE: OUTSIDE_FIRE: WILDFIRE_WILDLAND": 141

# ==============================================================================
# ANALYSIS CATEGORIES
# ==============================================================================

analysis_categories:
  battery_subcategories:
    e_bike: "E-Bike"
    e_scooter: "E-Scooter"
    ev_full_electric: "Electric Vehicle (Full Electric)"
    ev_hybrid: "Electric Vehicle (Hybrid)"
    ev_plug_in_hybrid: "Electric Vehicle (Plug-In Hybrid)"
    energy_storage_system: "Energy Storage System (ESS/BESS)"
    cell_phone: "Cell Phone"
    computer_tablet: "Computer/Tablet"
    power_bank: "Power Bank"
    e_cigarette: "E-Cigarette/Vape"
    mobility_device: "Mobility Assistance Device"
    vehicle_fire: "Vehicle Fire (Generic)"
    building_fire: "Building Fire"

  solar_subcategories:
    rooftop_residential: "Rooftop - Residential"
    rooftop_commercial: "Rooftop - Commercial"
    ground_mounted: "Ground-Mounted Array"
    solar_farm: "Solar Farm / Utility-Scale"
    solar_thermal: "Solar Thermal System"
    building_fire: "Building Fire with Solar"

  risk_levels:
    very_high: ["ESS/BESS", "Electric Trucks", "Electric Buses"]
    high: ["E-bikes", "E-scooters", "Full Electric Vehicles", "E-cigarettes"]
    medium_high: ["Plug-in Hybrids"]
    medium: ["Hybrids", "Consumer Electronics", "Power Tools"]
    low: ["Standard Batteries", "Low-capacity devices"]

# ==============================================================================
# METADATA
# ==============================================================================

metadata:
  version: "1.0.0"
  last_updated: "2026-03-26"
  neris_schema_version: "Beta (May 2024)"
  source: "https://github.com/ulfsri/neris-framework"
  documentation: "https://neris.fsri.org/technical-reference"
  api_endpoint: "https://api.neris.fsri.org/v1"

  notes:
    - "NERIS uses hierarchical incident types (3 levels)"
    - "NERIS has dedicated battery incident module (mod_battery_incident)"
    - "Thermal runaway is a Boolean field, not text-based"
    - "Product types enable granular e-bike/e-scooter/EV distinction"
    - "PV ignition type distinguishes SOURCE vs TARGET"
    - "All NFIRS codes continue to work for legacy data"
